name: Bundle pinned calendar libraries

on:
  push:
    paths:
      - '.github/workflows/vendor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download version-pinned browser libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/date-holidays@3.39.2/dist/umd.min.js \
            -o vendor/date-holidays.umd.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.8/lunar.js \
            -o vendor/lunar.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/chinese-days@1.5.10/dist/index.min.js \
            -o vendor/chinese-days.umd.min.js
          test -s vendor/date-holidays.umd.min.js
          test -s vendor/lunar.js
          test -s vendor/chinese-days.umd.min.js
          wc -c vendor/*.js
      - name: Commit only pinned browser bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/date-holidays.umd.min.js vendor/lunar.js vendor/chinese-days.umd.min.js
          if ! git diff --cached --quiet; then
            git commit -m "vendor: ship offline calendar bundles"
            git push origin HEAD:main
          fi
